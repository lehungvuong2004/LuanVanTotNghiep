name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'project1_FrontEnd/**'
  workflow_dispatch: # Cho phép chạy thủ công từ tab Actions

# Thiết lập quyền hạn cho GITHUB_TOKEN để deploy lên GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Tránh xung đột khi deploy nhiều lần cùng lúc
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./project1_FrontEnd

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài đặt Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./project1_FrontEnd/package-lock.json

      # 3. Cài đặt dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Kiểm tra lỗi (Linting) - Bỏ qua lỗi nhỏ để tránh dừng build
      - name: Run ESLint
        run: npm run lint || echo "Lint warnings found but continuing build..."

      # 5. Build source code
      # --base=/LuanVanTotNghiep/ giúp trang web tải đúng CSS/JS trên GitHub Pages
      - name: Build Project
        run: npx vite build --base=/LuanVanTotNghiep/

      # 6. Cấu hình GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 7. Upload thư mục build (dist) lên GitHub Pages Artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./project1_FrontEnd/dist

      # 8. Thực hiện Deploy lên GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

services:
  api-gateway:
    build: ./api-gateway
    container_name: lv-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./api-gateway:/app
      - /app/vendor
    depends_on:
      - identity-service
      - order-service
      - payment-service
      - provider-service

  identity-service:
    build: ./identity-service
    container_name: lv-identity
    ports:
      - "8001:8000"
    env_file:
      - ./identity-service/.env
    volumes:
      - ./identity-service:/app
      - /app/vendor
    depends_on:
      - identity-db

  identity-db:
    image: mysql:8.0
    container_name: lv-identity-db
    environment:
      MYSQL_DATABASE: homeservice_identity_db
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3307:3306"
    volumes:
      - identity-db-data:/var/lib/mysql

  order-service:
    build: ./order-service
    container_name: lv-order
    ports:
      - "8002:8000"
    env_file:
      - ./order-service/.env
    volumes:
      - ./order-service:/app
      - /app/vendor
    depends_on:
      - order-db

  order-db:
    image: mysql:8.0
    container_name: lv-order-db
    environment:
      MYSQL_DATABASE: homeservice_order_db
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3308:3306"
    volumes:
      - order-db-data:/var/lib/mysql

  payment-service:
    build: ./payment-service
    container_name: lv-payment
    ports:
      - "8003:8000"
    env_file:
      - ./payment-service/.env
    volumes:
      - ./payment-service:/app
      - /app/vendor
    depends_on:
      - payment-db

  payment-db:
    image: mysql:8.0
    container_name: lv-payment-db
    environment:
      MYSQL_DATABASE: homeservice_payment_db
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3309:3306"
    volumes:
      - payment-db-data:/var/lib/mysql

  provider-service:
    build: ./provider-service
    container_name: lv-provider
    ports:
      - "8004:8000"
    env_file:
      - ./provider-service/.env
    volumes:
      - ./provider-service:/app
      - /app/vendor
    depends_on:
      - provider-db

  provider-db:
    image: mysql:8.0
    container_name: lv-provider-db
    environment:
      MYSQL_DATABASE: homeservice_provider_db
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3310:3306"
    volumes:
      - provider-db-data:/var/lib/mysql

  frontend:
    build: ./project1_FrontEnd
    container_name: lv-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./project1_FrontEnd:/app
      - /app/node_modules
    depends_on:
      - api-gateway

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: lv-phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOSTS: lv-identity-db,lv-order-db,lv-payment-db,lv-provider-db
      PMA_USER: root
      PMA_PASSWORD: ""
    depends_on:
      - identity-db
      - order-db
      - payment-db
      - provider-db

volumes:
  identity-db-data:
  order-db-data:
  payment-db-data:
  provider-db-data:
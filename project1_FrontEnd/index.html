<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Family Vietnam connects families with trusted domestic helpers through an easy-to-use booking and job board platform. Find jobs, hire helpers, and manage bookings online" />
  <title>Family Vietnam - Booking & Job Board Platform</title>
  <script>
    (function () {
      try {
        var lcp = localStorage.getItem("lcp_banner");
        if (lcp) {
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.href = lcp;
          link.fetchPriority = "high";
          document.head.appendChild(link);
        }
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
